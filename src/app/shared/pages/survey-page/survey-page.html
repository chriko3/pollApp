@if (survey) {
  <div class="survey wrapper">
    <div class="survey-header">
      <app-header-component (click)="goHome()" logoColor="dark"></app-header-component>
      <app-primary-button-component (click)="goCreate()" icon="add"
        >Create survey</app-primary-button-component
      >
    </div>

    <section class="survey-answer-container">
      <div class="survey-answers">
        <div class="survey-answer-info">
          <app-survery-status-component [color]="'deep'">Published</app-survery-status-component>
          <div>
            <p>Ends on {{ getEndDate() }}</p>
            <p>Category: {{ survey.category }}</p>
          </div>
        </div>
        <div class="survey-headline">
          <p>{{ survey.headline }}</p>
          <p>{{ survey.description }}</p>
        </div>
        <div class="survey-answer-list">
          <app-question-answer-component
            [questionNumber]="1"
            [questionTitle]="'Test Question'"
            [questionMoreAnswers]="true"
            [questions]="[
              { text: 'Billiard or news' },
              { text: 'Do you like Angular?' },
              { text: 'Coffee or tea?' },
              { text: 'Test' },
              { text: 'Test' },
            ]"
          ></app-question-answer-component>
        </div>
      </div>

      <div class="survey-results">
        <div class="survey-results-headline">
          <p>Survey results <span>LIVE</span></p>
        </div>
      </div>
    </section>
  </div>
}
